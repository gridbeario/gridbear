{% extends "me/base.html" %}

{% block title %}GridBear - Chat{% endblock %}
{% block page_title %}Chat{% endblock %}

{% block extra_css %}
<style>
    #chat-messages { scroll-behavior: smooth; }
    .msg-user { background: linear-gradient(135deg, rgba(14, 165, 233, 0.1), rgba(45, 212, 191, 0.05)); }
    .msg-other-user { background: linear-gradient(135deg, rgba(245, 158, 11, 0.1), rgba(251, 191, 36, 0.05)); }
    .msg-agent { background: rgba(100, 116, 139, 0.05); }
    .typing-indicator span {
        animation: blink 1.4s infinite both;
        display: inline-block;
        width: 6px; height: 6px;
        border-radius: 50%;
        background: currentColor;
        margin: 0 1px;
    }
    .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
    .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes blink {
        0%, 80%, 100% { opacity: 0.3; }
        40% { opacity: 1; }
    }
    /* Markdown prose styles */
    .prose { min-width: 0; max-width: 100%; overflow-wrap: break-word; word-break: break-word; }
    .prose pre { background: rgba(0,0,0,0.15); border-radius: 0.5rem; padding: 0.75rem 1rem; overflow-x: auto; margin: 0.5em 0; max-width: 100%; }
    .prose img { max-width: 100%; height: auto; }
    .prose code { background: rgba(0,0,0,0.1); border-radius: 0.25rem; padding: 0.1em 0.3em; font-size: 0.85em; }
    .prose pre code { background: none; padding: 0; font-size: 0.85em; }
    .prose ul, .prose ol { padding-left: 1.5em; margin: 0.5em 0; }
    .prose ul { list-style-type: disc; }
    .prose ol { list-style-type: decimal; }
    .prose p { margin: 0.4em 0; }
    .prose p:first-child { margin-top: 0; }
    .prose p:last-child { margin-bottom: 0; }
    .prose a { color: #0ea5e9; text-decoration: underline; }
    .prose blockquote { border-left: 3px solid rgba(100,116,139,0.3); padding-left: 0.75em; margin: 0.5em 0; opacity: 0.85; }
    .prose table { border-collapse: collapse; margin: 0.5em 0; }
    .prose th, .prose td { border: 1px solid rgba(100,116,139,0.2); padding: 0.3em 0.6em; }
    .prose h1, .prose h2, .prose h3 { font-weight: 600; margin: 0.6em 0 0.3em; }
    .prose h1 { font-size: 1.25em; }
    .prose h2 { font-size: 1.1em; }
    .prose h3 { font-size: 1em; }
    /* Conversation list */
    .conv-item { transition: all 0.15s ease; }
    .conv-item:hover { background: rgba(100, 116, 139, 0.08); }
    .conv-active { background: linear-gradient(135deg, rgba(45, 212, 191, 0.1), rgba(14, 165, 233, 0.05)); border-left: 2px solid #2dd4bf; }
    /* Attachment preview strip */
    .attach-preview { max-height: 80px; }
    .attach-preview img { height: 64px; width: 64px; object-fit: cover; border-radius: 0.5rem; }
    /* Drop zone overlay */
    .drop-overlay { background: rgba(20, 184, 166, 0.08); border: 2px dashed rgba(20, 184, 166, 0.4); }
    /* Voice recording pulse */
    @keyframes pulse-ring {
        0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.5); }
        70% { box-shadow: 0 0 0 8px rgba(239, 68, 68, 0); }
        100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
    }
    .mic-recording { animation: pulse-ring 1.5s ease-out infinite; }
</style>
{% endblock %}

{% block content %}
<!-- Hidden CSRF field -->
<input type="hidden" name="csrf_token" value="{{ csrf_token(request) }}">
<!-- Hidden file input -->
<input type="file" id="file-input" class="hidden" multiple
       accept="image/*,.pdf,.txt,.csv,.json,.xml,.md,.doc,.docx,.xls,.xlsx,.mp3,.wav,.m4a,.ogg,.flac,.webm,.mp4">

<div class="flex h-[calc(100dvh-10rem)] gap-4" x-data="chatApp()">
    <!-- Sidebar: conversations -->
    <div class="flex-shrink-0 flex flex-col rounded-2xl border border-void-200 dark:border-void-800 bg-white/50 dark:bg-void-900/30 overflow-hidden"
         :class="mobileView === 'conversations' ? 'w-full lg:w-72 lg:flex' : 'hidden lg:flex lg:w-72'">
        <!-- Agent selector -->
        <div class="p-3 border-b border-void-200 dark:border-void-800" x-data="{ agentOpen: false }">
            <button @click="agentOpen = !agentOpen" @click.outside="agentOpen = false"
                    class="w-full flex items-center gap-3 px-3 py-2 rounded-xl bg-white dark:bg-void-800/50 border border-void-200 dark:border-void-700 hover:border-nordic-500/40 transition-all relative">
                {% for agent in agents %}
                <template x-if="selectedAgent === '{{ agent.name }}'">
                    <div class="flex items-center gap-3 flex-1 min-w-0">
                        {% if agent.avatar %}
                        <img src="/static/avatars/{{ agent.avatar }}" alt="" class="w-8 h-8 rounded-lg object-cover flex-shrink-0">
                        {% else %}
                        <div class="w-8 h-8 rounded-lg bg-gradient-to-br from-nordic-500 to-frost-500 flex items-center justify-center flex-shrink-0">
                            <span class="text-white text-xs font-bold">{{ (agent.display_name or agent.name)[0]|upper }}</span>
                        </div>
                        {% endif %}
                        <div class="min-w-0">
                            <p class="text-sm font-medium truncate">{{ agent.display_name or agent.name }}</p>
                            {% if agent.description %}
                            <p class="text-[10px] text-void-400 truncate">{{ agent.description }}</p>
                            {% endif %}
                        </div>
                    </div>
                </template>
                {% endfor %}
                <i class="fas fa-chevron-down text-void-400 text-xs flex-shrink-0 transition-transform" :class="agentOpen && 'rotate-180'"></i>
            </button>
            <!-- Dropdown -->
            <div x-show="agentOpen" x-transition
                 class="mt-2 rounded-xl bg-white dark:bg-void-800 border border-void-200 dark:border-void-700 shadow-lg overflow-hidden">
                {% for agent in agents %}
                <button @click="selectedAgent = '{{ agent.name }}'; agentOpen = false; switchAgent()"
                        class="w-full flex items-center gap-3 px-3 py-2.5 hover:bg-void-50 dark:hover:bg-void-700/50 transition-colors"
                        :class="selectedAgent === '{{ agent.name }}' && 'bg-nordic-500/5'">
                    {% if agent.avatar %}
                    <img src="/static/avatars/{{ agent.avatar }}" alt="" class="w-8 h-8 rounded-lg object-cover flex-shrink-0">
                    {% else %}
                    <div class="w-8 h-8 rounded-lg bg-gradient-to-br from-nordic-500 to-frost-500 flex items-center justify-center flex-shrink-0">
                        <span class="text-white text-xs font-bold">{{ (agent.display_name or agent.name)[0]|upper }}</span>
                    </div>
                    {% endif %}
                    <div class="text-left min-w-0">
                        <p class="text-sm font-medium truncate">{{ agent.display_name or agent.name }}</p>
                        {% if agent.description %}
                        <p class="text-[10px] text-void-400 truncate">{{ agent.description }}</p>
                        {% endif %}
                    </div>
                    <i x-show="selectedAgent === '{{ agent.name }}'" class="fas fa-check text-nordic-500 text-xs ml-auto flex-shrink-0"></i>
                </button>
                {% endfor %}
            </div>
        </div>

        <!-- New conversation button -->
        <div class="p-3 border-b border-void-200 dark:border-void-800">
            <button @click="newConversation()"
                    :disabled="creatingConversation"
                    class="w-full flex items-center justify-center gap-2 px-3 py-2 rounded-xl bg-gradient-to-r from-nordic-500 to-nordic-600 text-white text-sm font-medium hover:from-nordic-600 hover:to-nordic-700 transition-all shadow-lg shadow-nordic-500/20 disabled:opacity-50">
                <i class="fas fa-plus text-xs"></i>
                <span>{{ _("New conversation") }}</span>
            </button>
        </div>

        <!-- Conversation list -->
        <div class="flex-1 overflow-y-auto">
            <template x-if="sidebarLoading">
                <div class="flex items-center justify-center py-8 text-void-400">
                    <i class="fas fa-circle-notch fa-spin mr-2"></i>
                    <span class="text-sm">{{ _("Loading...") }}</span>
                </div>
            </template>
            <template x-if="!sidebarLoading && conversations.length === 0">
                <div class="text-center py-8 px-4">
                    <i class="fas fa-comments text-2xl text-void-300 dark:text-void-600 mb-2"></i>
                    <p class="text-sm text-void-400">{{ _("No conversations") }}</p>
                </div>
            </template>
            <!-- Pinned conversations -->
            <template x-for="conv in conversations.filter(function(c) { return c.pinned; })" :key="conv.id">
                <div class="conv-item px-3 py-3 cursor-pointer flex items-start gap-2 group"
                     :class="activeConversationId === conv.id ? 'conv-active' : ''"
                     @click="selectConversation(conv)"
                     @contextmenu.prevent="ctxMenu = { show: true, x: $event.clientX, y: $event.clientY, conv: conv }">
                    <div class="flex-1 min-w-0 flex items-center gap-1.5">
                        <i class="fas fa-thumbtack text-[9px] text-nordic-500 flex-shrink-0 -rotate-45"></i>
                        <span x-show="conv.unread"
                              class="w-2 h-2 rounded-full bg-nordic-500 flex-shrink-0"></span>
                        <div class="min-w-0">
                            <p class="text-sm font-medium truncate flex items-center gap-1"
                               :class="activeConversationId === conv.id ? 'text-nordic-700 dark:text-nordic-300' : conv.unread ? 'text-nordic-600 dark:text-nordic-400 font-semibold' : 'text-void-700 dark:text-void-300'">
                                <i x-show="conv.type === 'shared'" class="fas fa-users text-[9px] text-void-400"></i>
                                <span x-text="conv.title || i18n.newConversation" class="truncate"></span>
                            </p>
                            <p class="text-[10px] text-void-400 mt-0.5" x-text="formatDate(conv.updated_at)"></p>
                        </div>
                    </div>
                    <div class="flex items-center gap-0.5 flex-shrink-0 lg:opacity-0 lg:group-hover:opacity-100 transition-all">
                        <button @click.stop="togglePin(conv)"
                                class="p-1 rounded-lg hover:bg-nordic-500/10 text-nordic-500 transition-all"
                                title="{{ _("Unpin") }}">
                            <i class="fas fa-thumbtack text-xs -rotate-45"></i>
                        </button>
                        <button @click.stop="ctxMenu = { show: true, x: $event.currentTarget.getBoundingClientRect().left, y: $event.currentTarget.getBoundingClientRect().bottom, conv: conv }"
                                class="p-1 rounded-lg hover:bg-nordic-500/10 text-void-400 hover:text-nordic-500 transition-all"
                                title="{{ _("More") }}">
                            <i class="fas fa-ellipsis-vertical text-xs"></i>
                        </button>
                    </div>
                </div>
            </template>
            <!-- Separator between pinned and unpinned -->
            <template x-if="conversations.some(function(c) { return c.pinned; }) && conversations.some(function(c) { return !c.pinned; })">
                <div class="border-t border-void-200 dark:border-void-700 mx-3 my-1"></div>
            </template>
            <!-- Unpinned conversations -->
            <template x-for="conv in conversations.filter(function(c) { return !c.pinned; })" :key="conv.id">
                <div class="conv-item px-3 py-3 cursor-pointer flex items-start gap-2 group"
                     :class="activeConversationId === conv.id ? 'conv-active' : ''"
                     @click="selectConversation(conv)"
                     @contextmenu.prevent="ctxMenu = { show: true, x: $event.clientX, y: $event.clientY, conv: conv }">
                    <div class="flex-1 min-w-0 flex items-center gap-1.5">
                        <span x-show="conv.unread"
                              class="w-2 h-2 rounded-full bg-nordic-500 flex-shrink-0"></span>
                        <div class="min-w-0">
                            <p class="text-sm font-medium truncate flex items-center gap-1"
                               :class="activeConversationId === conv.id ? 'text-nordic-700 dark:text-nordic-300' : conv.unread ? 'text-nordic-600 dark:text-nordic-400 font-semibold' : 'text-void-700 dark:text-void-300'">
                                <i x-show="conv.type === 'shared'" class="fas fa-users text-[9px] text-void-400"></i>
                                <span x-text="conv.title || i18n.newConversation" class="truncate"></span>
                            </p>
                            <p class="text-[10px] text-void-400 mt-0.5" x-text="formatDate(conv.updated_at)"></p>
                        </div>
                    </div>
                    <div class="flex items-center gap-0.5 flex-shrink-0 lg:opacity-0 lg:group-hover:opacity-100 transition-all">
                        <button @click.stop="togglePin(conv)"
                                class="p-1 rounded-lg hover:bg-nordic-500/10 text-void-400 hover:text-nordic-500 transition-all"
                                title="{{ _("Pin") }}">
                            <i class="fas fa-thumbtack text-xs"></i>
                        </button>
                        <button @click.stop="ctxMenu = { show: true, x: $event.currentTarget.getBoundingClientRect().left, y: $event.currentTarget.getBoundingClientRect().bottom, conv: conv }"
                                class="p-1 rounded-lg hover:bg-nordic-500/10 text-void-400 hover:text-nordic-500 transition-all"
                                title="{{ _("More") }}">
                            <i class="fas fa-ellipsis-vertical text-xs"></i>
                        </button>
                    </div>
                </div>
            </template>
        </div>

        <!-- Footer: status + TTS toggle -->
        <div class="p-3 border-t border-void-200 dark:border-void-800 flex items-center justify-between">
            <span class="text-xs px-2 py-1 rounded-full" :class="wsConnected ? 'bg-nordic-500/10 text-nordic-600 dark:text-nordic-400' : 'bg-red-500/10 text-red-500'">
                <i class="fas fa-circle text-[6px] mr-1"></i>
                <span x-text="wsConnected ? i18n.connected : i18n.disconnected"></span>
            </span>
            <button @click="toggleEnterToSend()"
                    class="p-1.5 rounded-lg transition-all text-xs flex items-center gap-1"
                    :class="enterToSend ? 'bg-nordic-500/10 text-nordic-600 dark:text-nordic-400' : 'bg-amber-500/10 text-amber-600 dark:text-amber-400'"
                    :title="enterToSend ? 'Enter = {{ _("send") }}, Ctrl+Enter = {{ _("new line") }}' : 'Enter = {{ _("new line") }}, Ctrl+Enter = {{ _("send") }}'">
                <i class="fas fa-keyboard"></i>
                <span x-text="enterToSend ? 'Enter = {{ _("send") }}' : 'Enter = {{ _("new line") }}'"></span>
            </button>
            <button @click="toggleTts()"
                    class="p-1.5 rounded-lg transition-all text-xs"
                    :class="ttsEnabled ? 'bg-nordic-500/10 text-nordic-600 dark:text-nordic-400' : 'text-void-400 hover:text-void-600 dark:hover:text-void-300'"
                    :title="ttsEnabled ? i18n.disableTts : i18n.enableTts">
                <i class="fas" :class="ttsEnabled ? 'fa-volume-high' : 'fa-volume-xmark'"></i>
            </button>
        </div>
    </div>

    <!-- Context menu for conversations -->
    <div x-show="ctxMenu.show" x-cloak
         @click.away="ctxMenu.show = false"
         @keydown.escape.window="ctxMenu.show = false"
         class="fixed z-50 bg-white dark:bg-void-800 border border-void-200 dark:border-void-700 rounded-lg shadow-lg py-1 min-w-[160px]"
         :style="'left:' + ctxMenu.x + 'px;top:' + ctxMenu.y + 'px'">
        <button @click="if(ctxMenu.conv) togglePin(ctxMenu.conv); ctxMenu.show = false"
                class="w-full px-3 py-2 text-left text-sm hover:bg-void-100 dark:hover:bg-void-700 flex items-center gap-2">
            <i class="fas fa-thumbtack text-xs" :class="ctxMenu.conv && ctxMenu.conv.pinned ? 'text-nordic-500 -rotate-45' : 'text-void-400'"></i>
            <span x-text="ctxMenu.conv && ctxMenu.conv.pinned ? '{{ _("Unpin") }}' : '{{ _("Pin") }}'"></span>
        </button>
        <button @click="if(ctxMenu.conv) { selectConversation(ctxMenu.conv); contextPanelOpen = true; } ctxMenu.show = false"
                class="w-full px-3 py-2 text-left text-sm hover:bg-void-100 dark:hover:bg-void-700 flex items-center gap-2">
            <i class="fas fa-gear text-xs text-void-400"></i>
            <span>{{ _("Context") }}</span>
        </button>
        <button @click="if(ctxMenu.conv) { selectConversation(ctxMenu.conv); loadParticipants(); participantsPanelOpen = true; } ctxMenu.show = false"
                class="w-full px-3 py-2 text-left text-sm hover:bg-void-100 dark:hover:bg-void-700 flex items-center gap-2">
            <i class="fas fa-users text-xs text-void-400"></i>
            <span>{{ _("Participants") }}</span>
        </button>
        <button @click="if(ctxMenu.conv) { selectConversation(ctxMenu.conv); loadDocuments(); docsPanelOpen = true; } ctxMenu.show = false"
                class="w-full px-3 py-2 text-left text-sm hover:bg-void-100 dark:hover:bg-void-700 flex items-center gap-2">
            <i class="fas fa-file-lines text-xs text-void-400"></i>
            <span>{{ _("Documents") }}</span>
        </button>
        <button x-show="ctxMenu.conv && (ctxMenu.conv.has_plan || (ctxMenu.conv.id === activeConversationId && currentPlan))"
                @click="if(ctxMenu.conv) { selectConversation(ctxMenu.conv); loadPlan(); planPanelOpen = true; } ctxMenu.show = false"
                class="w-full px-3 py-2 text-left text-sm hover:bg-void-100 dark:hover:bg-void-700 flex items-center gap-2">
            <i class="fas fa-list-check text-xs text-void-400"></i>
            <span>{{ _("Plan") }}</span>
        </button>
        <button @click="if(ctxMenu.conv) renameConversation(ctxMenu.conv); ctxMenu.show = false"
                class="w-full px-3 py-2 text-left text-sm hover:bg-void-100 dark:hover:bg-void-700 flex items-center gap-2">
            <i class="fas fa-pen text-xs text-void-400"></i>
            <span>{{ _("Rename") }}</span>
        </button>
        <div class="border-t border-void-200 dark:border-void-700 my-1"></div>
        <button @click="if(ctxMenu.conv) deleteConversation(ctxMenu.conv.id); ctxMenu.show = false"
                class="w-full px-3 py-2 text-left text-sm hover:bg-red-50 dark:hover:bg-red-900/20 text-red-500 flex items-center gap-2">
            <i class="fas fa-trash-can text-xs"></i>
            <span>{{ _("Delete") }}</span>
        </button>
    </div>

    <!-- Chat area -->
    <div class="flex-1 min-w-0"
         :class="mobileView === 'chat' ? 'flex flex-col' : 'hidden lg:flex lg:flex-col'">
        <!-- Mobile back button -->
        <button @click="mobileView = 'conversations'"
                class="lg:hidden flex items-center gap-2 px-3 py-2 mb-2 text-sm text-void-500 hover:text-nordic-600 dark:hover:text-nordic-400 transition-colors">
            <i class="fas fa-arrow-left"></i>
            <span>{{ _("Conversations") }}</span>
        </button>
        <!-- Empty state -->
        <template x-if="!activeConversationId">
            <div class="flex-1 flex flex-col items-center justify-center text-void-400">
                <i class="fas fa-message text-4xl mb-4 text-void-300 dark:text-void-600"></i>
                <p class="text-lg font-medium mb-1">{{ _("Select or create a conversation") }}</p>
                <p class="text-sm">{{ _("Conversations are saved automatically") }}</p>
            </div>
        </template>

        <!-- Active conversation -->
        <template x-if="activeConversationId">
            <div class="flex-1 flex flex-col min-h-0">
                <!-- Context editor panel -->
                <div x-show="contextPanelOpen" x-transition
                     class="mb-2 p-3 rounded-xl border border-void-200 dark:border-void-800 bg-white/50 dark:bg-void-900/30">
                    <div class="flex items-center justify-between mb-2">
                        <span class="text-xs font-medium text-void-500">{{ _("Conversation Context") }}</span>
                        <div class="flex items-center gap-2">
                            <span class="text-[10px] text-void-400"
                                  x-text="conversationContext.length + '/2000'"></span>
                            <button @click="saveContext(); contextPanelOpen = false"
                                    class="p-1 rounded-lg hover:bg-void-100 dark:hover:bg-void-800/50 text-void-400 hover:text-void-600 transition-all"
                                    title="{{ _('Close') }}">
                                <i class="fas fa-xmark text-xs"></i>
                            </button>
                        </div>
                    </div>
                    <textarea x-model="conversationContext"
                              @blur="saveContext()"
                              @keydown.ctrl.enter="saveContext()"
                              maxlength="2000"
                              rows="3"
                              placeholder="{{ _('Describe what you are working on...') }}"
                              class="w-full px-3 py-2 rounded-lg bg-white dark:bg-void-800/50 border border-void-200 dark:border-void-700 text-sm focus:ring-2 focus:ring-nordic-500/40 focus:border-nordic-500 outline-none transition-all resize-none"></textarea>
                    <div x-show="contextSaving" class="text-[10px] text-nordic-500 mt-1">
                        <i class="fas fa-circle-notch fa-spin mr-1"></i> {{ _("Saving...") }}
                    </div>
                </div>
                <!-- Participants panel -->
                <div x-show="participantsPanelOpen" x-transition
                     class="mb-2 p-3 rounded-xl border border-void-200 dark:border-void-800 bg-white/50 dark:bg-void-900/30">
                    <div class="flex items-center justify-between mb-2">
                        <span class="text-xs font-medium text-void-500">{{ _("Participants") }}</span>
                        <button @click="participantsPanelOpen = false"
                                class="p-1 rounded-lg hover:bg-void-100 dark:hover:bg-void-800/50 text-void-400 hover:text-void-600 transition-all">
                            <i class="fas fa-xmark text-xs"></i>
                        </button>
                    </div>
                    <div class="space-y-1 mb-3">
                        <template x-for="p in participants" :key="p.uid">
                            <div class="flex items-center justify-between py-1 px-2 rounded-lg hover:bg-void-50 dark:hover:bg-void-800/30">
                                <div class="flex items-center gap-2">
                                    <span class="w-2 h-2 rounded-full" :class="isParticipantOnline(p.uid) ? 'bg-green-500' : 'bg-void-300'"></span>
                                    <span class="text-sm" x-text="p.display_name"></span>
                                    <span class="text-[10px] text-void-400" x-text="'@' + p.uid"></span>
                                    <span x-show="p.role === 'owner'" class="text-[9px] px-1.5 py-0.5 rounded-full bg-nordic-500/10 text-nordic-500">owner</span>
                                </div>
                                <button x-show="p.role !== 'owner' && isCurrentUserOwner()"
                                        @click="removeParticipant(p.uid)"
                                        class="p-1 rounded-lg hover:bg-red-500/10 text-void-400 hover:text-red-500 transition-all"
                                        title="{{ _('Remove') }}">
                                    <i class="fas fa-user-minus text-xs"></i>
                                </button>
                            </div>
                        </template>
                    </div>
                    <!-- Agent -->
                    <div class="py-1 px-2 flex items-center gap-2 border-t border-void-100 dark:border-void-800 mt-1 pt-2">
                        <span class="w-2 h-2 rounded-full bg-nordic-500"></span>
                        <span class="text-sm font-medium text-nordic-500" x-text="agentNames[selectedAgent] || selectedAgent"></span>
                        <span class="text-[10px] text-void-400" x-text="'@' + selectedAgent"></span>
                        <span class="text-[9px] px-1.5 py-0.5 rounded-full bg-nordic-500/10 text-nordic-500">agent</span>
                    </div>
                    <!-- Invite input -->
                    <div class="flex gap-2">
                        <input type="text" x-model="inviteUsername" placeholder="{{ _('Username to invite...') }}"
                               class="flex-1 px-3 py-1.5 rounded-lg bg-white dark:bg-void-800/50 border border-void-200 dark:border-void-700 text-sm focus:ring-2 focus:ring-nordic-500/40 focus:border-nordic-500 outline-none">
                        <button @click="inviteUser()" :disabled="!inviteUsername.trim()"
                                class="px-3 py-1.5 rounded-lg bg-nordic-500 hover:bg-nordic-600 text-white text-xs font-medium transition-colors disabled:opacity-50">
                            <i class="fas fa-user-plus mr-1"></i> {{ _("Invite") }}
                        </button>
                    </div>
                </div>
                <!-- Documents panel -->
                <div x-show="docsPanelOpen" x-transition
                     class="mb-2 p-3 rounded-xl border border-void-200 dark:border-void-800 bg-white/50 dark:bg-void-900/30">
                    <div class="flex items-center justify-between mb-2">
                        <span class="text-xs font-medium text-void-500">{{ _("Documents") }}</span>
                        <div class="flex items-center gap-2">
                            <label class="p-1 rounded-lg hover:bg-void-100 dark:hover:bg-void-800/50 text-void-400 hover:text-nordic-500 transition-all cursor-pointer"
                                   title="{{ _('Upload document') }}">
                                <i class="fas fa-plus text-xs"></i>
                                <input type="file" class="hidden" @change="uploadDocument($event)"
                                       accept=".pdf,.txt,.csv,.json,.xml,.md,.doc,.docx,.xls,.xlsx">
                            </label>
                            <button @click="docsPanelOpen = false"
                                    class="p-1 rounded-lg hover:bg-void-100 dark:hover:bg-void-800/50 text-void-400 hover:text-void-600 transition-all">
                                <i class="fas fa-xmark text-xs"></i>
                            </button>
                        </div>
                    </div>
                    <div class="space-y-1 max-h-48 overflow-y-auto">
                        <template x-if="conversationDocs.length === 0 && !docsUploading">
                            <div class="text-xs text-void-400 text-center py-3">
                                <i class="fas fa-file-circle-plus text-lg mb-1 block"></i>
                                {{ _("No documents yet") }}
                            </div>
                        </template>
                        <template x-for="doc in conversationDocs" :key="doc.id">
                            <div class="flex items-center justify-between py-1.5 px-2 rounded-lg hover:bg-void-50 dark:hover:bg-void-800/30 group">
                                <a :href="'/me/chat/api/conversations/' + activeConversationId + '/documents/' + doc.id + '/download'"
                                   :download="doc.original_filename"
                                   class="flex items-center gap-2 min-w-0 flex-1 hover:text-nordic-500 transition-colors">
                                    <i class="fas fa-file text-void-400 text-xs flex-shrink-0"></i>
                                    <div class="min-w-0">
                                        <div class="text-xs truncate" x-text="doc.original_filename"></div>
                                        <div class="text-[10px] text-void-400" x-text="formatFileSize(doc.file_size)"></div>
                                    </div>
                                </a>
                                <div class="flex items-center gap-0.5 lg:opacity-0 lg:group-hover:opacity-100 transition-all">
                                    <a :href="'/me/chat/api/conversations/' + activeConversationId + '/documents/' + doc.id + '/download'"
                                       target="_blank"
                                       class="p-1 rounded-lg hover:bg-nordic-500/10 text-void-400 hover:text-nordic-500 transition-all"
                                       title="{{ _('Download') }}">
                                        <i class="fas fa-download text-[10px]"></i>
                                    </a>
                                    <button @click="deleteDocument(doc.id)"
                                            class="p-1 rounded-lg hover:bg-red-500/10 text-void-400 hover:text-red-500 transition-all"
                                            title="{{ _('Remove') }}">
                                        <i class="fas fa-trash-can text-[10px]"></i>
                                    </button>
                                </div>
                            </div>
                        </template>
                        <template x-if="docsUploading">
                            <div class="text-xs text-void-400 text-center py-2">
                                <i class="fas fa-circle-notch fa-spin mr-1"></i> {{ _("Uploading...") }}
                            </div>
                        </template>
                    </div>
                </div>
                <!-- Plan panel -->
                <div x-show="planPanelOpen && currentPlan" x-transition
                     class="mb-2 p-3 rounded-xl border border-void-200 dark:border-void-800 bg-white/50 dark:bg-void-900/30">
                    <div class="flex items-center justify-between mb-2">
                        <div class="flex items-center gap-2">
                            <span class="text-xs font-medium text-void-500" x-text="currentPlan ? currentPlan.title : ''"></span>
                            <span class="text-[9px] px-1.5 py-0.5 rounded-full"
                                  :class="currentPlan ? planStatusBadge(currentPlan.status) : ''"
                                  x-text="currentPlan ? currentPlan.status : ''"></span>
                        </div>
                        <div class="flex items-center gap-1">
                            <template x-if="currentPlan && currentPlan.status === 'draft'">
                                <button @click="executePlan()" class="px-2 py-0.5 rounded-lg bg-nordic-500 hover:bg-nordic-600 text-white text-[10px] font-medium transition-colors">
                                    <i class="fas fa-play mr-1"></i>{{ _("Execute") }}
                                </button>
                            </template>
                            <template x-if="currentPlan && currentPlan.status === 'active'">
                                <button @click="pausePlan()" class="px-2 py-0.5 rounded-lg bg-amber-500/20 hover:bg-amber-500/30 text-amber-600 text-[10px] font-medium transition-colors">
                                    <i class="fas fa-pause mr-1"></i>{{ _("Pause") }}
                                </button>
                            </template>
                            <template x-if="currentPlan && currentPlan.status === 'paused'">
                                <button @click="resumePlan()" class="px-2 py-0.5 rounded-lg bg-nordic-500/20 hover:bg-nordic-500/30 text-nordic-600 text-[10px] font-medium transition-colors">
                                    <i class="fas fa-play mr-1"></i>{{ _("Resume") }}
                                </button>
                            </template>
                            <template x-if="currentPlan && currentPlan.status !== 'completed' && currentPlan.status !== 'cancelled'">
                                <button @click="if(confirm('{{ _("Cancel this plan?") }}')) cancelPlan()"
                                        class="px-2 py-0.5 rounded-lg bg-red-500/10 hover:bg-red-500/20 text-red-500 text-[10px] transition-colors"
                                        title="{{ _('Cancel plan') }}">
                                    <i class="fas fa-trash-can mr-1"></i>{{ _("Cancel") }}
                                </button>
                            </template>
                            <button @click="planPanelOpen = false"
                                    class="p-1 rounded-lg hover:bg-void-100 dark:hover:bg-void-800/50 text-void-400 hover:text-void-600 transition-all"
                                    title="{{ _('Close panel') }}">
                                <i class="fas fa-chevron-up text-xs"></i>
                            </button>
                        </div>
                    </div>
                    <div class="space-y-1 max-h-60 overflow-y-auto">
                        <template x-for="(task, taskIdx) in (currentPlan ? currentPlan.tasks : [])" :key="task.id">
                            <div class="flex items-start gap-2 py-1 px-2 rounded-lg hover:bg-void-50 dark:hover:bg-void-800/30 group">
                                <span class="text-[10px] text-void-400 mt-0.5 w-4 text-right flex-shrink-0" x-text="taskIdx + 1"></span>
                                <i :class="planTaskIcon(task.status)" class="mt-0.5 text-xs flex-shrink-0"></i>
                                <div class="flex-1 min-w-0 cursor-pointer" @click="openTaskDetail(task)">
                                    <div class="text-xs" x-text="task.title"></div>
                                    <div x-show="task.result" class="text-[10px] text-void-400 mt-0.5 truncate" x-text="task.result"></div>
                                </div>
                                <div class="flex items-center gap-0.5 lg:opacity-0 lg:group-hover:opacity-100 transition-all">
                                    <button @click="openTaskDetail(task)"
                                            class="p-0.5 rounded hover:bg-nordic-500/10 text-void-400 hover:text-nordic-500 transition-all"
                                            title="{{ _('Edit') }}">
                                        <i class="fas fa-pen text-[10px]"></i>
                                    </button>
                                    <button x-show="task.status === 'pending' && currentPlan && (currentPlan.status === 'draft' || currentPlan.status === 'paused')"
                                            @click="removePlanTask(task.id)"
                                            class="p-0.5 rounded hover:bg-red-500/10 text-void-400 hover:text-red-500 transition-all"
                                            title="{{ _('Remove') }}">
                                        <i class="fas fa-xmark text-[10px]"></i>
                                    </button>
                                </div>
                            </div>
                        </template>
                    </div>
                    <template x-if="currentPlan && (currentPlan.status === 'draft' || currentPlan.status === 'paused')">
                        <div class="flex gap-1.5 mt-2">
                            <input type="text" x-model="_newPlanTask" placeholder="{{ _('Add task...') }}"
                                   @keydown.enter="addPlanTask()"
                                   class="flex-1 px-2 py-1 rounded-lg bg-white dark:bg-void-800/50 border border-void-200 dark:border-void-700 text-xs focus:ring-1 focus:ring-nordic-500/40 outline-none">
                            <button @click="addPlanTask()" :disabled="!_newPlanTask || !_newPlanTask.trim()"
                                    class="px-2 py-1 rounded-lg bg-nordic-500/10 hover:bg-nordic-500/20 text-nordic-600 text-xs transition-colors disabled:opacity-50">
                                <i class="fas fa-plus"></i>
                            </button>
                        </div>
                    </template>
                </div>
                <!-- Task detail modal -->
                <div x-show="_editingTask" x-transition
                     class="fixed inset-0 z-50 flex items-center justify-center bg-black/30"
                     @click.self="_editingTask = null">
                    <div class="bg-white dark:bg-void-900 rounded-2xl border border-void-200 dark:border-void-700 shadow-xl w-full max-w-md mx-4 p-5">
                        <template x-if="_editingTask">
                            <div>
                                <div class="flex items-center justify-between mb-4">
                                    <div class="flex items-center gap-2">
                                        <i :class="planTaskIcon(_editingTask.status)" class="text-sm"></i>
                                        <span class="text-[10px] px-1.5 py-0.5 rounded-full bg-void-100 dark:bg-void-800" x-text="_editingTask.status"></span>
                                    </div>
                                    <button @click="_editingTask = null" class="p-1 rounded-lg hover:bg-void-100 dark:hover:bg-void-800 text-void-400 hover:text-void-600">
                                        <i class="fas fa-xmark"></i>
                                    </button>
                                </div>
                                <div class="mb-3">
                                    <label class="text-[10px] font-medium text-void-500 mb-1 block">{{ _("Title") }}</label>
                                    <input type="text" x-model="_editingTask.title"
                                           :disabled="currentPlan && currentPlan.status !== 'draft' && currentPlan.status !== 'paused'"
                                           class="w-full px-3 py-2 rounded-lg bg-void-50 dark:bg-void-800/50 border border-void-200 dark:border-void-700 text-sm focus:ring-2 focus:ring-nordic-500/40 outline-none disabled:opacity-50">
                                </div>
                                <div class="mb-3">
                                    <label class="text-[10px] font-medium text-void-500 mb-1 block">{{ _("Description") }}</label>
                                    <textarea x-model="_editingTask.description" rows="3"
                                              :disabled="currentPlan && currentPlan.status !== 'draft' && currentPlan.status !== 'paused'"
                                              placeholder="{{ _('Optional description...') }}"
                                              class="w-full px-3 py-2 rounded-lg bg-void-50 dark:bg-void-800/50 border border-void-200 dark:border-void-700 text-sm focus:ring-2 focus:ring-nordic-500/40 outline-none resize-none disabled:opacity-50"></textarea>
                                </div>
                                <template x-if="_editingTask.result">
                                    <div class="mb-3">
                                        <label class="text-[10px] font-medium text-void-500 mb-1 block">{{ _("Result") }}</label>
                                        <div class="px-3 py-2 rounded-lg bg-void-50 dark:bg-void-800/50 border border-void-200 dark:border-void-700 text-sm text-void-600 dark:text-void-300 whitespace-pre-wrap max-h-40 overflow-y-auto"
                                             x-text="_editingTask.result"></div>
                                    </div>
                                </template>
                                <div class="flex justify-end gap-2 mt-4">
                                    <button @click="_editingTask = null"
                                            class="px-3 py-1.5 rounded-lg text-sm text-void-500 hover:bg-void-100 dark:hover:bg-void-800 transition-colors">
                                        {{ _("Close") }}
                                    </button>
                                    <template x-if="currentPlan && (currentPlan.status === 'draft' || currentPlan.status === 'paused')">
                                        <button @click="saveTaskDetail()" class="px-3 py-1.5 rounded-lg bg-nordic-500 hover:bg-nordic-600 text-white text-sm font-medium transition-colors">
                                            {{ _("Save") }}
                                        </button>
                                    </template>
                                </div>
                            </div>
                        </template>
                    </div>
                </div>
                <!-- Messages -->
                <div id="chat-messages" class="flex-1 min-w-0 overflow-y-auto overflow-x-hidden space-y-3 rounded-2xl border border-void-200 dark:border-void-800 bg-white/50 dark:bg-void-900/30 p-4 relative"
                     @dragover.prevent="dragOver = true"
                     @dragleave.prevent="dragOver = false"
                     @drop.prevent="handleDrop($event)">
                    <!-- Drop overlay -->
                    <div x-show="dragOver" x-transition
                         class="drop-overlay absolute inset-0 z-10 flex items-center justify-center rounded-2xl">
                        <div class="text-nordic-500 text-center">
                            <i class="fas fa-cloud-arrow-up text-3xl mb-2"></i>
                            <p class="text-sm font-medium">{{ _("Drop files here") }}</p>
                        </div>
                    </div>

                    <template x-if="messagesLoading">
                        <div class="flex items-center justify-center py-8 text-void-400">
                            <i class="fas fa-circle-notch fa-spin mr-2"></i>
                            <span class="text-sm">{{ _("Loading messages...") }}</span>
                        </div>
                    </template>
                    <template x-for="msg in messages" :key="msg.id">
                        <div :class="msg.role === 'user' ? 'msg-user ml-2 sm:ml-8' : msg.role === 'other_user' ? 'msg-other-user mr-2 sm:mr-8' : msg.role === 'system' ? 'mx-2 sm:mx-8 text-center' : 'msg-agent mr-2 sm:mr-8'" class="rounded-xl p-4 min-w-0 overflow-hidden">
                            <template x-if="msg.role === 'system'">
                                <div class="text-[11px] text-void-400 italic" x-text="msg.text"></div>
                            </template>
                            <template x-if="msg.role !== 'system'">
                                <div class="min-w-0">
                                    <div class="flex items-center gap-2 mb-1">
                                        <span class="text-[10px] font-semibold uppercase tracking-wide"
                                              :class="msg.role === 'user' ? 'text-frost-500' : msg.role === 'other_user' ? 'text-amber-500' : 'text-nordic-500'"
                                              x-text="msg.role === 'user' ? '{{ user.display_name or user.username }}' : msg.role === 'other_user' ? msg.display_name : msg.agent || selectedAgent"></span>
                                        <span class="text-[10px] text-void-400" x-text="msg.time"></span>
                                    </div>
                                    <!-- Attachment thumbnails in message -->
                                    <template x-if="msg.attachments && msg.attachments.length">
                                        <div class="flex flex-wrap gap-2 mb-2">
                                            <template x-for="att in msg.attachments" :key="att.filename">
                                                <div class="flex items-center gap-1.5 px-2 py-1 rounded-lg bg-void-100 dark:bg-void-800/50 text-xs">
                                                    <template x-if="att.previewUrl">
                                                        <img :src="att.previewUrl" class="h-10 w-10 object-cover rounded">
                                                    </template>
                                                    <template x-if="!att.previewUrl">
                                                        <i class="fas fa-file text-void-400"></i>
                                                    </template>
                                                    <span class="text-void-500 truncate max-w-[120px]" x-text="att.filename"></span>
                                                </div>
                                            </template>
                                        </div>
                                    </template>
                                    <div class="text-sm leading-relaxed prose min-w-0 max-w-full" x-html="msg.isHtml ? msg.text : renderMarkdown(msg.text)"></div>
                                </div>
                            </template>
                        </div>
                    </template>

                    <!-- Typing indicators -->
                    <template x-if="otherUserTyping">
                        <div class="msg-other-user mr-2 sm:mr-8 rounded-xl px-4 py-2">
                            <span class="text-[10px] text-amber-500 italic" x-text="otherUserTyping + ' {{ _("is typing...") }}'"></span>
                        </div>
                    </template>
                    <template x-if="isTyping">
                        <div class="msg-agent mr-2 sm:mr-8 rounded-xl p-4 flex items-center gap-3">
                            <div class="typing-indicator text-void-400">
                                <span></span><span></span><span></span>
                            </div>
                            <button @click="stopAgent()"
                                    class="px-2 py-1 rounded-lg bg-red-500/10 hover:bg-red-500/20 text-red-500 text-[10px] font-medium transition-colors flex items-center gap-1">
                                <i class="fas fa-stop"></i> Stop
                            </button>
                        </div>
                    </template>
                    <!-- New message indicator (sticky at bottom) -->
                    <button x-show="hasNewMessages"
                            x-transition
                            @click="jumpToBottom()"
                            class="sticky bottom-0 left-1/2 -translate-x-1/2 mx-auto px-3 py-1.5 rounded-full bg-nordic-500 hover:bg-nordic-600 text-white text-xs font-medium shadow-lg flex items-center gap-1.5 transition-all z-10">
                        <i class="fas fa-arrow-down"></i>
                        {{ _("New messages") }}
                    </button>
                </div>

                <!-- Attachment preview strip -->
                <div x-show="pendingFiles.length > 0" class="mt-2 flex items-center gap-2 px-2 attach-preview overflow-x-auto">
                    <template x-for="(pf, idx) in pendingFiles" :key="idx">
                        <div class="relative flex-shrink-0 group">
                            <template x-if="pf.previewUrl">
                                <img :src="pf.previewUrl" class="h-16 w-16 object-cover rounded-lg border border-void-200 dark:border-void-700">
                            </template>
                            <template x-if="!pf.previewUrl">
                                <div class="h-16 w-16 rounded-lg border border-void-200 dark:border-void-700 flex flex-col items-center justify-center bg-void-50 dark:bg-void-800/50">
                                    <i class="fas fa-file text-void-400 text-lg"></i>
                                    <span class="text-[8px] text-void-400 truncate w-14 text-center mt-0.5" x-text="pf.file.name"></span>
                                </div>
                            </template>
                            <!-- Uploading spinner -->
                            <div x-show="pf.uploading" class="absolute inset-0 bg-black/40 rounded-lg flex items-center justify-center">
                                <i class="fas fa-circle-notch fa-spin text-white text-sm"></i>
                            </div>
                            <!-- Remove button -->
                            <button @click="removePendingFile(idx)"
                                    class="absolute -top-1.5 -right-1.5 w-5 h-5 rounded-full bg-red-500 text-white text-[10px] flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity">
                                <i class="fas fa-xmark"></i>
                            </button>
                        </div>
                    </template>
                </div>

                <!-- Input -->
                <div class="mt-3 flex flex-col gap-2">
                    <!-- Voice interim text preview -->
                    <div x-show="voiceInterim" x-transition class="px-4 py-1.5 text-xs text-void-400 italic truncate">
                        <i class="fas fa-microphone text-red-400 mr-1"></i>
                        <span x-text="voiceInterim"></span>
                    </div>
                    <div class="flex gap-2 items-end relative">
                        <!-- Attach button -->
                        <button @click="$refs.fileInput ? $refs.fileInput.click() : document.getElementById('file-input').click()"
                                :disabled="!wsConnected"
                                class="px-3 py-3 rounded-xl bg-void-100 dark:bg-void-800/50 border border-void-200 dark:border-void-700 text-void-500 hover:text-nordic-500 hover:border-nordic-500/30 transition-all disabled:opacity-50"
                                title="{{ _("Attach file") }}">
                            <i class="fas fa-paperclip"></i>
                        </button>
                        <!-- Mention autocomplete dropdown -->
                        <div x-show="mentionOpen" class="absolute bottom-full left-0 mb-1 w-64 bg-white dark:bg-void-900 border border-void-200 dark:border-void-700 rounded-xl shadow-lg overflow-hidden z-50">
                            <template x-for="(item, idx) in mentionSuggestions()" :key="item.uid">
                                <button @mousedown.prevent="selectMention(item)"
                                        class="w-full px-3 py-2 text-left text-sm flex items-center gap-2 transition-colors"
                                        :class="idx === mentionIndex ? 'bg-nordic-500/10 text-nordic-600 dark:text-nordic-400' : 'hover:bg-void-50 dark:hover:bg-void-800/50'">
                                    <span x-text="item.display_name" class="font-medium"></span>
                                    <span class="text-[10px] text-void-400" x-text="'@' + item.uid"></span>
                                    <span x-show="item.type === 'agent'" class="text-[9px] px-1 py-0.5 rounded-full bg-nordic-500/10 text-nordic-500 ml-auto">agent</span>
                                </button>
                            </template>
                        </div>
                        <textarea x-model="inputText"
                               @keydown="handleKeydown($event)"
                               @paste="handlePaste($event)"
                               @input="autoResize($event); sendUserTyping(); checkMentionTrigger($event)"
                               placeholder="{{ _("Type a message or paste an image...") }}"
                               :disabled="!wsConnected"
                               rows="1"
                               class="flex-1 px-4 py-3 rounded-xl bg-white dark:bg-void-800/50 border border-void-200 dark:border-void-700 text-sm focus:ring-2 focus:ring-nordic-500/40 focus:border-nordic-500 outline-none transition-all disabled:opacity-50 resize-none overflow-y-auto"
                               style="max-height: 150px"></textarea>
                        <!-- Microphone button -->
                        <button x-show="voiceSupported"
                                @click="toggleVoice()"
                                :disabled="!wsConnected"
                                :class="voiceActive ? 'bg-red-500 text-white border-red-500 mic-recording' : 'bg-void-100 dark:bg-void-800/50 border-void-200 dark:border-void-700 text-void-500 hover:text-nordic-500 hover:border-nordic-500/30'"
                                class="px-3 py-3 rounded-xl border transition-all disabled:opacity-50"
                                :title="voiceActive ? i18n.stopRecording : i18n.startRecording">
                            <i class="fas fa-microphone"></i>
                        </button>
                        <button @click="sendMessage()" :disabled="!wsConnected || (!inputText.trim() && !pendingFiles.length)"
                                class="px-3 sm:px-5 py-3 rounded-xl bg-gradient-to-r from-nordic-500 to-nordic-600 text-white text-sm font-medium hover:from-nordic-600 hover:to-nordic-700 transition-all shadow-lg shadow-nordic-500/20 disabled:opacity-50 disabled:cursor-not-allowed">
                            <i class="fas fa-paper-plane"></i>
                        </button>
                    </div>
                </div>
            </div>
        </template>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script>
window.i18n = {
    newConversation: {{ _("New conversation")|tojson }},
    connected: {{ _("Connected")|tojson }},
    disconnected: {{ _("Disconnected")|tojson }},
    typePlaceholder: {{ _("Type a message or paste an image...")|tojson }},
    loading: {{ _("Loading...")|tojson }},
    loadingMessages: {{ _("Loading messages...")|tojson }},
    noConversations: {{ _("No conversations")|tojson }},
    rename: {{ _("Rename")|tojson }},
    deleteLabel: {{ _("Delete")|tojson }},
    startRecording: {{ _("Start dictation")|tojson }},
    stopRecording: {{ _("Stop dictation")|tojson }},
    enableTts: {{ _("Enable voice reading")|tojson }},
    disableTts: {{ _("Disable voice reading")|tojson }},
    uploadFailed: {{ _("Upload failed")|tojson }},
    networkError: {{ _("Network error")|tojson }},
    micDenied: {{ _("Microphone access denied")|tojson }},
    attachFile: {{ _("Attach file")|tojson }},
    dropFilesHere: {{ _("Drop files here")|tojson }},
    deleteConfirm: {{ _("Delete this conversation?")|tojson }},
    renamePrompt: {{ _("Rename conversation:")|tojson }},
    error: {{ _("Error:")|tojson }},
    toolCall: {{ _("Tool call")|tojson }},
    audioRecorded: {{ _("Audio recorded - press enter to send")|tojson }},
    audioRecording: {{ _("Audio recording...")|tojson }},
    voiceRecognitionError: {{ _("Voice recognition startup error")|tojson }},
    codeBlock: {{ _("code block")|tojson }},
};
</script>
<script>
function chatApp() {
    return {
        selectedAgent: '{{ agents[0].name if agents else '' }}',
        agentNames: { {% for agent in agents %}'{{ agent.name }}': '{{ agent.display_name or agent.name }}'{% if not loop.last %}, {% endif %}{% endfor %} },
        messages: [],
        inputText: '',
        isTyping: false,
        wsConnected: false,
        ws: null,
        msgCounter: 0,
        hasNewMessages: false,

        // Mobile view toggle: 'conversations' or 'chat'
        mobileView: 'conversations',

        conversations: [],
        activeConversationId: null,
        ctxMenu: { show: false, x: 0, y: 0, conv: null },
        sidebarLoading: false,
        messagesLoading: false,
        creatingConversation: false,

        // Conversation context
        conversationContext: '',
        lastSavedContext: '',
        contextPanelOpen: false,
        contextSaving: false,

        // Documents panel
        docsPanelOpen: false,
        conversationDocs: [],
        docsUploading: false,

        // Plan
        planPanelOpen: false,
        currentPlan: null,
        _newPlanTask: '',
        _planResuming: false,
        _editingTask: null,

        // Participants
        participantsPanelOpen: false,
        participants: [],
        inviteUsername: '',
        _lastTypingSent: 0,
        otherUserTyping: null,
        _typingTimeout: null,

        // Mention autocomplete
        mentionOpen: false,
        mentionFilter: '',
        mentionIndex: 0,
        _mentionStart: -1,

        // Attachments
        pendingFiles: [],  // [{file, previewUrl, uploading, uploadedPath, filename}]
        dragOver: false,

        // Voice
        voiceSupported: false,
        voiceActive: false,
        voiceInterim: '',
        _recognition: null,
        _mediaRecorder: null,
        _audioChunks: [],
        _voiceMode: null,  // 'speech-api' or 'recorder'
        _voiceCommitted: '',  // text already committed to inputText by speech API
        _voiceRestarting: false,

        // Enter behavior: true = Enter sends, Ctrl+Enter for newline (default)
        enterToSend: localStorage.getItem('gridbear_enter_to_send') !== '0',

        // TTS
        ttsEnabled: localStorage.getItem('gridbear_tts') === '1',
        ttsProvider: 'browser',
        _currentAudio: null,

        init() {
            var self = this;
            if (typeof marked !== 'undefined') {
                marked.setOptions({ breaks: true, gfm: true });
            }
            // Request notification permission
            if ('Notification' in window && Notification.permission === 'default') {
                Notification.requestPermission();
            }
            this.loadConversations();

            // PWA standalone: intercept external links to open in system browser
            // (otherwise they open inside the PWA frame and the user gets stuck)
            var isStandalone = window.matchMedia('(display-mode: standalone)').matches
                || window.navigator.standalone === true;
            if (isStandalone) {
                document.addEventListener('click', function(e) {
                    var anchor = e.target.closest('a[target="_blank"]');
                    if (!anchor) return;
                    // Skip download links — handled by browser save dialog
                    if (anchor.hasAttribute('download')) return;
                    var href = anchor.getAttribute('href');
                    if (!href || !href.match(/^https?:/)) return;
                    e.preventDefault();
                    // Force open in system browser via window.open without name
                    window.open(href, '_blank', 'noopener,noreferrer');
                });
            }

            // Reset hasNewMessages when user manually scrolls to bottom
            setTimeout(function() {
                var msgEl = document.getElementById('chat-messages');
                if (msgEl) {
                    msgEl.addEventListener('scroll', function() {
                        var nearBottom = (msgEl.scrollHeight - msgEl.scrollTop - msgEl.clientHeight) < 50;
                        if (nearBottom && self.hasNewMessages) {
                            self.hasNewMessages = false;
                        }
                    });
                }
            }, 500);

            // Wire up the global file input
            var fileInput = document.getElementById('file-input');
            if (fileInput) {
                fileInput.addEventListener('change', function(e) {
                    self.addFiles(e.target.files);
                    e.target.value = '';
                });
            }

            // Detect voice support
            var SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (SpeechRecognition) {
                self._voiceMode = 'speech-api';
                self.voiceSupported = true;
            } else if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
                self._voiceMode = 'recorder';
                self.voiceSupported = true;
            }

            // Fetch TTS provider config
            fetch('/me/chat/api/tts/config')
                .then(function(r) { return r.json(); })
                .then(function(data) {
                    var d = data.data || {};
                    if (d.provider) self.ttsProvider = d.provider;
                })
                .catch(function() {});
        },

        _csrfToken() {
            var el = document.querySelector('input[name="csrf_token"]');
            return el ? el.value : '';
        },

        _apiHeaders() {
            return {
                'Content-Type': 'application/json',
                'X-CSRF-Token': this._csrfToken(),
            };
        },

        renderMarkdown(text) {
            if (!text) return '';
            // Highlight @mentions
            text = text.replace(/@(\w+)/g, '<span class="text-nordic-500 font-semibold">@$1</span>');
            var html;
            if (typeof marked !== 'undefined') {
                html = marked.parse(text);
            } else {
                html = text.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/\n/g, '<br>');
            }
            // Add target="_blank" + rel to all external links so the global
            // click handler can intercept them when running as a standalone PWA
            html = html.replace(/<a\s+href="(https?:[^"]+)"/g, '<a href="$1" target="_blank" rel="noopener noreferrer external"');
            return html;
        },

        // --- File handling ---

        handlePaste(e) {
            var items = (e.clipboardData || e.originalEvent.clipboardData).items;
            var files = [];
            for (var i = 0; i < items.length; i++) {
                if (items[i].kind === 'file') {
                    var file = items[i].getAsFile();
                    if (file) files.push(file);
                }
            }
            if (files.length > 0) {
                e.preventDefault();
                this.addFiles(files);
            }
            // If no files pasted, let the default text paste happen
        },

        handleDrop(e) {
            this.dragOver = false;
            if (e.dataTransfer && e.dataTransfer.files.length > 0) {
                this.addFiles(e.dataTransfer.files);
            }
        },

        addFiles(fileList) {
            var self = this;
            for (var i = 0; i < fileList.length; i++) {
                var file = fileList[i];
                var entry = {
                    file: file,
                    filename: file.name,
                    previewUrl: null,
                    uploading: false,
                    uploadedPath: null,
                };

                // Generate preview for images
                if (file.type && file.type.startsWith('image/')) {
                    entry.previewUrl = URL.createObjectURL(file);
                }

                self.pendingFiles.push(entry);
            }
        },

        removePendingFile(idx) {
            var entry = this.pendingFiles[idx];
            if (entry && entry.previewUrl) {
                URL.revokeObjectURL(entry.previewUrl);
            }
            this.pendingFiles.splice(idx, 1);
        },

        async _uploadPendingFiles() {
            var self = this;
            var paths = [];
            for (var i = 0; i < self.pendingFiles.length; i++) {
                var pf = self.pendingFiles[i];
                if (pf.uploadedPath) {
                    paths.push(pf.uploadedPath);
                    continue;
                }
                pf.uploading = true;
                try {
                    var formData = new FormData();
                    formData.append('file', pf.file);
                    var resp = await fetch('/me/chat/api/upload', {
                        method: 'POST',
                        headers: { 'X-CSRF-Token': self._csrfToken() },
                        body: formData,
                    });
                    var data = await resp.json();
                    var ud = data.data || {};
                    if (resp.ok && ud.path) {
                        pf.uploadedPath = ud.path;
                        pf.filename = ud.filename;
                        paths.push(ud.path);
                    } else {
                        if (typeof showToast === 'function') {
                            showToast(i18n.uploadFailed + ': ' + (data.error || i18n.error), 'error');
                        }
                    }
                } catch(err) {
                    if (typeof showToast === 'function') {
                        showToast(i18n.uploadFailed + ': ' + err.message, 'error');
                    }
                }
                pf.uploading = false;
            }
            return paths;
        },

        // --- Conversation management ---

        loadConversations() {
            var self = this;
            self.sidebarLoading = true;
            fetch('/me/chat/api/conversations?agent=' + encodeURIComponent(self.selectedAgent))
                .then(function(r) { return r.json(); })
                .then(function(data) {
                    self.conversations = (data.data && data.data.conversations) || [];
                    self.sidebarLoading = false;
                })
                .catch(function() {
                    self.sidebarLoading = false;
                });
        },

        newConversation() {
            var self = this;
            self.creatingConversation = true;
            fetch('/me/chat/api/conversations', {
                method: 'POST',
                headers: self._apiHeaders(),
                body: JSON.stringify({ agent_name: self.selectedAgent }),
            })
            .then(function(r) { return r.json(); })
            .then(function(data) {
                var cd = data.data || {};
                if (cd.conversation) {
                    self.conversations.unshift(cd.conversation);
                    self.selectConversation(cd.conversation);
                }
                self.creatingConversation = false;
            })
            .catch(function() {
                self.creatingConversation = false;
            });
        },

        selectConversation(conv) {
            var self = this;
            if (self.activeConversationId === conv.id) return;

            window.speechSynthesis.cancel();
            self._stopServerAudio();
            self.activeConversationId = conv.id;
            self.mobileView = 'chat';
            self.messages = [];
            self.isTyping = false;
            self.messagesLoading = true;
            self._clearPendingFiles();
            self.conversationContext = '';
            self.lastSavedContext = '';
            self.contextPanelOpen = false;
            self.participantsPanelOpen = false;
            self.docsPanelOpen = false;
            self.participants = [];
            self.conversationDocs = [];
            conv.unread = false;

            // Load participants (for mention autocomplete)
            self.loadParticipants();

            // Load documents
            self.loadDocuments();

            // Load plan
            self.currentPlan = null;
            self.planPanelOpen = false;
            self.loadPlan();

            // Load conversation context
            fetch('/me/chat/api/conversations/' + conv.id + '/context')
                .then(function(r) { return r.json(); })
                .then(function(data) {
                    var ctx = (data.data && data.data.context_prompt) || '';
                    self.conversationContext = ctx;
                    self.lastSavedContext = ctx;
                })
                .catch(function() {});

            // Load history
            fetch('/me/chat/api/conversations/' + conv.id + '/messages')
                .then(function(r) { return r.json(); })
                .then(function(data) {
                    var msgs = (data.data && data.data.messages) || [];
                    var currentUid = '{{ user.username }}';
                    self.messages = msgs.map(function(m) {
                        var role = m.role;
                        if (role === 'assistant') {
                            role = 'agent';
                        } else if (role === 'user' && m.sender_id && m.sender_id !== currentUid && m.sender_id !== 'system') {
                            role = 'other_user';
                        }
                        return {
                            id: ++self.msgCounter,
                            role: role,
                            sender: m.sender_id,
                            display_name: m.sender_display_name || m.sender_id,
                            text: m.content,
                            time: self._formatTime(m.created_at),
                            agent: self.selectedAgent,
                        };
                    });
                    self.messagesLoading = false;
                    self.$nextTick(function() { self.scrollToBottom(true); });
                })
                .catch(function() {
                    self.messagesLoading = false;
                });

            // (Re)connect WebSocket with conversation_id
            self._connectWs();
        },

        deleteConversation(convId) {
            if (!confirm(i18n.deleteConfirm)) return;
            var self = this;
            fetch('/me/chat/api/conversations/' + convId, {
                method: 'DELETE',
                headers: self._apiHeaders(),
            })
            .then(function(r) { return r.json(); })
            .then(function(data) {
                if (data.ok) {
                    self.conversations = self.conversations.filter(function(c) { return c.id !== convId; });
                    if (self.activeConversationId === convId) {
                        self.activeConversationId = null;
                        self.messages = [];
                        self.mobileView = 'conversations';
                        self._clearPendingFiles();
                        if (self.ws) { self.ws.close(); self.ws = null; }
                    }
                }
            });
        },

        renameConversation(conv) {
            var newTitle = prompt(i18n.renamePrompt, conv.title || '');
            if (newTitle === null) return;
            newTitle = newTitle.trim();
            if (!newTitle) return;
            var self = this;
            fetch('/me/chat/api/conversations/' + conv.id + '/rename', {
                method: 'POST',
                headers: self._apiHeaders(),
                body: JSON.stringify({ title: newTitle }),
            })
            .then(function(r) { return r.json(); })
            .then(function(data) {
                if (data.ok) {
                    conv.title = (data.data && data.data.title) || conv.title;
                }
            });
        },

        togglePin(conv) {
            var self = this;
            var action = conv.pinned ? 'unpin' : 'pin';
            fetch('/me/chat/api/conversations/' + conv.id + '/' + action, {
                method: 'POST',
                headers: self._apiHeaders(),
            })
            .then(function(r) { return r.json(); })
            .then(function(data) {
                if (data.ok) {
                    conv.pinned = !conv.pinned;
                    self.loadConversations();
                }
            });
        },

        // --- WebSocket ---

        connect() {
            // Called on init - we don't auto-connect until a conversation is selected
        },

        _connectWs() {
            var self = this;
            // Close existing connection
            if (self.ws) {
                self.ws.onclose = null; // prevent reconnect loop
                self.ws.close();
                self.ws = null;
                self.wsConnected = false;
            }
            if (!self.activeConversationId) return;

            var proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
            var url = proto + '//' + location.host + '/ws/chat?agent=' + encodeURIComponent(self.selectedAgent)
                    + '&conversation_id=' + encodeURIComponent(self.activeConversationId);
            self.ws = new WebSocket(url);

            self.ws.onopen = function() {
                self.wsConnected = true;
            };

            self.ws.onmessage = function(event) {
                var data = JSON.parse(event.data);
                if (data.type === 'message') {
                    self.isTyping = false;
                    var agentName = data.agent || self.selectedAgent;
                    var agentMentionedMe = (data.text || '').toLowerCase().indexOf('@{{ user.username }}') !== -1;
                    self._notify(self.agentNames[agentName] || agentName, (data.text || '').substring(0, 100), agentMentionedMe, self.activeConversationId);
                    self.messages.push({
                        id: ++self.msgCounter,
                        role: 'agent',
                        agent: agentName,
                        text: data.text,
                        time: new Date().toLocaleTimeString('it-IT', {hour: '2-digit', minute: '2-digit'}),
                    });
                    self._speakText(data.text);
                    self._bubbleConversation();
                    self.$nextTick(function() { self.scrollToBottom(); });
                } else if (data.type === 'stream') {
                    self.isTyping = false;
                    var last = self.messages[self.messages.length - 1];
                    if (last && last.role === 'agent' && last._streaming) {
                        last.text += data.text;
                    } else {
                        self.messages.push({
                            id: ++self.msgCounter,
                            role: 'agent',
                            agent: data.agent || self.selectedAgent,
                            text: data.text,
                            time: new Date().toLocaleTimeString('it-IT', {hour: '2-digit', minute: '2-digit'}),
                            _streaming: true,
                        });
                    }
                    self.$nextTick(function() { self.scrollToBottom(); });
                } else if (data.type === 'stream_end') {
                    var last = self.messages[self.messages.length - 1];
                    if (last) {
                        last._streaming = false;
                        self._speakText(last.text);
                    }
                    self._bubbleConversation();
                } else if (data.type === 'tool_call') {
                    self.isTyping = true;
                    var last = self.messages[self.messages.length - 1];
                    if (last && last._isTool) {
                        last.text = '\u{1F527} ' + (data.tool || 'tool');
                    } else {
                        self.messages.push({
                            id: ++self.msgCounter,
                            role: 'system',
                            text: '\u{1F527} ' + (data.tool || 'tool'),
                            time: new Date().toLocaleTimeString('it-IT', {hour: '2-digit', minute: '2-digit'}),
                            _isTool: true,
                        });
                    }
                    self.$nextTick(function() { self.scrollToBottom(); });
                } else if (data.type === 'typing') {
                    self.isTyping = true;
                    self.$nextTick(function() { self.scrollToBottom(); });
                } else if (data.type === 'user_typing') {
                    self.otherUserTyping = data.display_name || data.sender || 'Someone';
                    clearTimeout(self._typingTimeout);
                    self._typingTimeout = setTimeout(function() {
                        self.otherUserTyping = null;
                    }, 4000);
                } else if (data.type === 'error') {
                    self.isTyping = false;
                    var errMsg = data.text || data.details || data.error_type || 'unknown error';
                    self.messages.push({
                        id: ++self.msgCounter,
                        role: 'agent',
                        text: i18n.error + ' ' + errMsg,
                        time: new Date().toLocaleTimeString('it-IT', {hour: '2-digit', minute: '2-digit'}),
                    });
                } else if (data.type === 'attachment') {
                    // Bot sent a file/image via send_file_to_chat
                    var isImage = (data.mimetype || '').startsWith('image/');
                    var html = '';
                    if (isImage) {
                        html = '<img src="' + data.url + '" alt="' + (data.filename || '') + '" class="max-w-sm rounded-lg shadow-md cursor-pointer" onclick="window.open(this.src, \'_blank\')">';
                    } else {
                        html = '<a href="' + data.url + '" target="_blank" class="inline-flex items-center gap-2 px-3 py-2 rounded-lg bg-nordic-500/10 text-nordic-600 dark:text-nordic-400 hover:bg-nordic-500/20 transition-all text-sm"><i class="fas fa-file-download"></i> ' + (data.filename || 'file') + '</a>';
                    }
                    if (data.caption) {
                        html = (data.caption ? '<p class="text-sm mb-2">' + data.caption + '</p>' : '') + html;
                    }
                    self.messages.push({
                        id: ++self.msgCounter,
                        role: 'agent',
                        text: html,
                        isHtml: true,
                        time: new Date().toLocaleTimeString('it-IT', {hour: '2-digit', minute: '2-digit'}),
                    });
                    self.isTyping = false;
                    self.$nextTick(function() { self.scrollToBottom(); });
                } else if (data.type === 'user_message') {
                    // Message from another user in shared conversation
                    // Only render if it belongs to the currently active conversation
                    if (data.conversation_id && data.conversation_id !== self.activeConversationId) {
                        // Mark the other conversation as unread and notify
                        var mentioned = (data.text || '').toLowerCase().indexOf('@{{ user.username }}') !== -1;
                        self._notify(data.display_name || data.sender, (data.text || '').substring(0, 100), mentioned, data.conversation_id);
                        for (var i = 0; i < self.conversations.length; i++) {
                            if (self.conversations[i].id === data.conversation_id) {
                                self.conversations[i].unread = true;
                                break;
                            }
                        }
                        self._bubbleConversation(data.conversation_id);
                    } else {
                        var mentioned = (data.text || '').toLowerCase().indexOf('@{{ user.username }}') !== -1;
