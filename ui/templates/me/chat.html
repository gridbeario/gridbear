                        self._notify(data.display_name || data.sender, (data.text || '').substring(0, 100), mentioned, data.conversation_id || self.activeConversationId);
                        self.messages.push({
                            id: ++self.msgCounter,
                            role: 'other_user',
                            sender: data.sender,
                            display_name: data.display_name || data.sender,
                            text: data.text,
                            time: data.time || new Date().toLocaleTimeString('it-IT', {hour: '2-digit', minute: '2-digit'}),
                        });
                        self.$nextTick(function() { self.scrollToBottom(); });
                    }
                } else if (data.type === 'participant_joined') {
                    self.messages.push({
                        id: ++self.msgCounter,
                        role: 'system',
                        text: (data.display_name || data.uid) + ' joined the conversation',
                        time: new Date().toLocaleTimeString('it-IT', {hour: '2-digit', minute: '2-digit'}),
                    });
                } else if (data.type === 'participant_removed' || data.type === 'participant_left') {
                    self.messages.push({
                        id: ++self.msgCounter,
                        role: 'system',
                        text: (data.display_name || data.uid || 'A participant') + ' left the conversation',
                        time: new Date().toLocaleTimeString('it-IT', {hour: '2-digit', minute: '2-digit'}),
                    });
                } else if (data.type === 'conversation_invited') {
                    // Reload conversations to show the new one
                    self.loadConversations();
                } else if (data.type === 'conversation_deleted') {
                    // Remove from sidebar and deselect if active
                    self.conversations = self.conversations.filter(function(c) { return c.id !== data.conversation_id; });
                    if (self.activeConversationId === data.conversation_id) {
                        self.activeConversationId = null;
                        self.messages = [];
                    }
                } else if (data.type === 'unread') {
                    // Mark conversation as having unread messages
                    if (data.conversation_id !== self.activeConversationId) {
                        for (var i = 0; i < self.conversations.length; i++) {
                            if (self.conversations[i].id === data.conversation_id) {
                                self.conversations[i].unread = true;
                                self._notify('New message', self.conversations[i].title || 'New message in conversation', true, data.conversation_id);
                                break;
                            }
                        }
                        self._bubbleConversation(data.conversation_id);
                    }
                } else if (data.type === 'conversation_update') {
                    // Update title in sidebar
                    for (var i = 0; i < self.conversations.length; i++) {
                        if (self.conversations[i].id === data.conversation_id) {
                            self.conversations[i].title = data.title;
                            break;
                        }
                    }
                } else if (data.type === 'stopped') {
                    self.isTyping = false;
                } else if (data.type === 'plan_created') {
                    self.currentPlan = data.plan;
                    self.planPanelOpen = true;
                    // Update has_plan on the conversation in sidebar
                    var conv = self.conversations.find(function(c) { return c.id === self.activeConversationId; });
                    if (conv) conv.has_plan = true;
                } else if (data.type === 'plan_task_update') {
                    if (self.currentPlan) {
                        var task = self.currentPlan.tasks.find(function(t) { return t.id === data.task_id; });
                        if (task) {
                            task.status = data.status;
                            if (data.result) task.result = data.result;
                        }
                        if (data.plan_status) self.currentPlan.status = data.plan_status;
                    }
                } else if (data.type === 'plan_updated') {
                    if (self.currentPlan && self.currentPlan.id === data.plan_id) {
                        var ch = data.changes || {};
                        if (ch.status) self.currentPlan.status = ch.status;
                        // Reload full plan from DB for structural changes
                        if (ch.added_tasks || ch.removed_tasks || ch.reordered || ch.updated_tasks) {
                            self.loadPlan();
                        }
                        // Update sidebar has_plan flag
                        if (ch.status === 'cancelled' || ch.status === 'completed') {
                            var conv = self.conversations.find(function(c) { return c.id === self.activeConversationId; });
                            if (conv) conv.has_plan = false;
                        }
                    }
                }
            };

            self.ws.onclose = function() {
                self.wsConnected = false;
                // Reconnect only if this conversation is still active
                if (self.activeConversationId) {
                    setTimeout(function() {
                        if (self.activeConversationId) self._connectWs();
                    }, 3000);
                }
            };

            self.ws.onerror = function() {
                self.wsConnected = false;
            };
        },

        async sendMessage() {
            var text = this.inputText.trim();
            var hasFiles = this.pendingFiles.length > 0;
            if ((!text && !hasFiles) || !this.wsConnected || !this.activeConversationId) return;

            // Upload files first if any
            var attachments = [];
            var attachmentInfo = [];
            if (hasFiles) {
                attachments = await this._uploadPendingFiles();
                // Collect preview info for message display
                for (var i = 0; i < this.pendingFiles.length; i++) {
                    attachmentInfo.push({
                        filename: this.pendingFiles[i].filename,
                        previewUrl: this.pendingFiles[i].previewUrl,
                    });
                }
            }

            // Show user message with attachments
            this.messages.push({
                id: ++this.msgCounter,
                role: 'user',
                text: text,
                time: new Date().toLocaleTimeString('it-IT', {hour: '2-digit', minute: '2-digit'}),
                attachments: attachmentInfo.length > 0 ? attachmentInfo : null,
            });

            this.inputText = '';
            this._voiceCommitted = '';
            this.pendingFiles = [];

            // Reset textarea height after send
            this.$nextTick(function() {
                var ta = self.$el.querySelector('textarea');
                if (ta) ta.style.height = 'auto';
            });

            // Restart speech recognition to clear old results buffer
            if (this.voiceActive && this._recognition) {
                this._voiceRestarting = true;
                this._recognition.stop();
            }

            // Send via WebSocket
            var payload = {
                type: 'message',
                text: text,
                agent: this.selectedAgent,
            };
            if (attachments.length > 0) {
                payload.attachments = attachments;
            }
            if (this.conversationContext) {
                payload.context_prompt = this.conversationContext;
            }
            this.ws.send(JSON.stringify(payload));

            var self = this;
            this.$nextTick(function() { self.scrollToBottom(true); });
        },

        stopAgent() {
            if (this.ws && this.ws.readyState === WebSocket.OPEN) {
                this.ws.send(JSON.stringify({ type: 'stop' }));
            }
            this.isTyping = false;
        },

        switchAgent() {
            window.speechSynthesis.cancel();
            this._stopServerAudio();
            if (this.ws) {
                this.ws.onclose = null;
                this.ws.close();
                this.ws = null;
            }
            this.wsConnected = false;
            this.activeConversationId = null;
            this.messages = [];
            this.mobileView = 'conversations';
            this._clearPendingFiles();
            this.loadConversations();
        },

        // --- Helpers ---

        _clearPendingFiles() {
            for (var i = 0; i < this.pendingFiles.length; i++) {
                if (this.pendingFiles[i].previewUrl) {
                    URL.revokeObjectURL(this.pendingFiles[i].previewUrl);
                }
            }
            this.pendingFiles = [];
        },

        // --- Voice ---

        toggleVoice() {
            if (this.voiceActive) {
                this.stopVoice();
            } else {
                this.startVoice();
            }
        },

        startVoice() {
            var self = this;
            if (self._voiceMode === 'speech-api') {
                self._startSpeechApi();
            } else if (self._voiceMode === 'recorder') {
                self._startRecorder();
            }
        },

        stopVoice() {
            var self = this;
            if (self._voiceMode === 'speech-api' && self._recognition) {
                self._recognition.stop();
            } else if (self._voiceMode === 'recorder' && self._mediaRecorder) {
                self._mediaRecorder.stop();
            }
            self.voiceActive = false;
            self.voiceInterim = '';
        },

        _startSpeechApi() {
            var self = this;
            var SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            var recognition = new SpeechRecognition();
            recognition.lang = 'it-IT';
            recognition.continuous = true;
            recognition.interimResults = true;

            self._voiceCommitted = self.inputText;

            recognition.onresult = function(event) {
                var interim = '';
                // Only process results from resultIndex onward to avoid
                // re-processing already finalized results
                for (var i = event.resultIndex; i < event.results.length; i++) {
                    var transcript = event.results[i][0].transcript;
                    if (event.results[i].isFinal) {
                        var sep = self._voiceCommitted && !self._voiceCommitted.endsWith(' ') ? ' ' : '';
                        self._voiceCommitted += sep + transcript;
                        self.inputText = self._voiceCommitted;
                    } else {
                        interim += transcript;
                    }
                }
                self.voiceInterim = interim;
            };

            recognition.onerror = function(event) {
                if (event.error === 'not-allowed') {
                    if (typeof showToast === 'function') {
                        showToast(i18n.micDenied, 'error');
                    }
                }
                self.voiceActive = false;
                self.voiceInterim = '';
            };

            recognition.onend = function() {
                self._recognition = null;
                if (self._voiceRestarting) {
                    // Restart after sendMessage cleared the buffer
                    self._voiceRestarting = false;
                    self._startSpeechApi();
                } else {
                    self.voiceActive = false;
                    self.voiceInterim = '';
                }
            };

            try {
                recognition.start();
                self._recognition = recognition;
                self.voiceActive = true;
            } catch(e) {
                if (typeof showToast === 'function') {
                    showToast(i18n.voiceRecognitionError, 'error');
                }
            }
        },

        async _startRecorder() {
            var self = this;
            try {
                var stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                self._audioChunks = [];
                var recorder = new MediaRecorder(stream, { mimeType: 'audio/webm' });

                recorder.ondataavailable = function(e) {
                    if (e.data.size > 0) self._audioChunks.push(e.data);
                };

                recorder.onstop = async function() {
                    // Stop microphone
                    stream.getTracks().forEach(function(t) { t.stop(); });
                    self.voiceActive = false;
                    self.voiceInterim = '';

                    if (self._audioChunks.length === 0) return;

                    var blob = new Blob(self._audioChunks, { type: 'audio/webm' });
                    var file = new File([blob], 'voce.webm', { type: 'audio/webm' });

                    // Add as pending file and let the user send it as attachment
                    self.pendingFiles.push({
                        file: file,
                        filename: 'voce.webm',
                        previewUrl: null,
                        uploading: false,
                        uploadedPath: null,
                    });

                    if (typeof showToast === 'function') {
                        showToast(i18n.audioRecorded, 'info');
                    }
                };

                recorder.start();
                self._mediaRecorder = recorder;
                self.voiceActive = true;
                self.voiceInterim = i18n.audioRecording;
            } catch(e) {
                if (typeof showToast === 'function') {
                    showToast(i18n.micDenied, 'error');
                }
            }
        },

        // --- Enter behavior ---

        handleKeydown(event) {
            // Mention autocomplete takes priority
            if (this.mentionOpen) {
                if (event.key === 'ArrowDown') {
                    event.preventDefault();
                    var s = this.mentionSuggestions();
                    this.mentionIndex = (this.mentionIndex + 1) % s.length;
                    return;
                } else if (event.key === 'ArrowUp') {
                    event.preventDefault();
                    var s = this.mentionSuggestions();
                    this.mentionIndex = (this.mentionIndex - 1 + s.length) % s.length;
                    return;
                } else if (event.key === 'Tab' || event.key === 'Enter') {
                    event.preventDefault();
                    var s = this.mentionSuggestions();
                    if (s[this.mentionIndex]) this.selectMention(s[this.mentionIndex]);
                    return;
                } else if (event.key === 'Escape') {
                    this.mentionOpen = false;
                    return;
                }
            }
            // Normal Enter handling
            if (event.key === 'Enter') {
                this.handleEnter(event);
            }
        },

        handleEnter(event) {
            if (this.enterToSend) {
                // Enter = send, Shift+Enter or Ctrl+Enter = newline
                if (!event.shiftKey && !event.ctrlKey) {
                    event.preventDefault();
                    this.sendMessage();
                }
            } else {
                // Enter = newline, Ctrl+Enter = send
                if (event.ctrlKey) {
                    event.preventDefault();
                    this.sendMessage();
                }
            }
        },

        toggleEnterToSend() {
            this.enterToSend = !this.enterToSend;
            localStorage.setItem('gridbear_enter_to_send', this.enterToSend ? '1' : '0');
        },

        // --- Conversation context ---

        saveContext() {
            var self = this;
            if (self.conversationContext === self.lastSavedContext) return;
            if (!self.activeConversationId) return;
            self.contextSaving = true;
            fetch('/me/chat/api/conversations/' + self.activeConversationId + '/context', {
                method: 'POST',

                body: JSON.stringify({ context_prompt: self.conversationContext }),
            })
            .then(function(r) { return r.json(); })

                self.contextSaving = false;

            })

        },

        // --- Participants ---

        loadParticipants() {
            var self = this;
            if (!self.activeConversationId) return;
            fetch('/me/chat/api/conversations/' + self.activeConversationId + '/participants')
                .then(function(r) { return r.json(); })
                .then(function(data) {
                    self.participants = (data.data && data.data.participants) || [];
                })
                .catch(function() { self.participants = []; });
        },

        inviteUser() {
            var self = this;
            var target = self.inviteUsername.trim().toLowerCase();
            if (!target || !self.activeConversationId) return;
            fetch('/me/chat/api/conversations/' + self.activeConversationId + '/invite', {
                method: 'POST',
                headers: {'Content-Type': 'application/json', 'X-CSRF-Token': document.querySelector('[name=csrf_token]') ? document.querySelector('[name=csrf_token]').value : ''},

            })

        isParticipantOnline(uid) {
            var p = this.participants.find(function(x) { return x.uid === uid; });
            return p ? p.online : false;
        },

        mentionSuggestions() {
            var filter = this.mentionFilter.toLowerCase();
            var items = [];
            // Add participants
            for (var i = 0; i < this.participants.length; i++) {
                var p = this.participants[i];
                items.push({ uid: p.uid, display_name: p.display_name, type: 'user' });
            }
            // Add agent
            items.push({
                uid: this.selectedAgent,
                display_name: this.agentNames[this.selectedAgent] || this.selectedAgent,
                type: 'agent',
            });
            if (!filter) return items;
            return items.filter(function(item) {
                return item.uid.toLowerCase().indexOf(filter) !== -1
                    || item.display_name.toLowerCase().indexOf(filter) !== -1;
            });
        },

        checkMentionTrigger(event) {
            var ta = event.target || document.querySelector('textarea[x-model="inputText"]');
            if (!ta) { this.mentionOpen = false; return; }
            var val = ta.value;
            var pos = ta.selectionStart;
            // Find @ before cursor
            var before = val.substring(0, pos);
            var atIdx = before.lastIndexOf('@');
            if (atIdx >= 0 && (atIdx === 0 || before[atIdx - 1] === ' ' || before[atIdx - 1] === '\n')) {
                var partial = before.substring(atIdx + 1);
                if (partial.indexOf(' ') === -1 && partial.length < 30) {
                    this.mentionFilter = partial;
                    this._mentionStart = atIdx;
                    this.mentionIndex = 0;
                    this.mentionOpen = this.mentionSuggestions().length > 0;
                    return;
                }
            }
            this.mentionOpen = false;
        },


        selectMention(item) {
            var ta = document.querySelector('textarea[x-model="inputText"]');
            var cursorPos = ta ? ta.selectionStart : this.inputText.length;
            var before = this.inputText.substring(0, this._mentionStart);
            var after = this.inputText.substring(cursorPos);
            this.inputText = before + '@' + item.uid + ' ' + after;
            this.mentionOpen = false;
            this.$nextTick(function() {
                if (ta) {
                    var pos = before.length + item.uid.length + 2;
                    ta.selectionStart = pos;
                    ta.selectionEnd = pos;
                    ta.focus();
                }
            });
        },

        _notify(title, body, force, convId) {
            if ('Notification' in window && Notification.permission === 'granted' && (document.hidden || force)) {
                var self = this;
                var n = new Notification(title, { body: body, icon: '/static/img/logo.svg', tag: 'webchat-' + (convId || Date.now()) });
                n.onclick = function() {
                    window.focus();
                    n.close();
                    if (convId) {
                        var conv = self.conversations.find(function(c) { return c.id === convId; });
                        if (conv) self.selectConversation(conv);
                    }
                };
            }
        },

        sendUserTyping() {
            var now = Date.now();
            if (now - this._lastTypingSent < 3000) return;
            this._lastTypingSent = now;
            if (this.ws && this.ws.readyState === 1) {
                this.ws.send(JSON.stringify({ type: 'user_typing' }));
            }
        },

        isCurrentUserOwner() {

        removeParticipant(uid) {

            })

        formatFileSize(bytes) {

        autoResize(event) {

        // --- TTS ---

        toggleTts() {
            this.ttsEnabled = !this.ttsEnabled;
            localStorage.setItem('gridbear_tts', this.ttsEnabled ? '1' : '0');
            if (!this.ttsEnabled) {
                window.speechSynthesis.cancel();
                this._stopServerAudio();
            }
        },

        _stopServerAudio() {
            if (this._currentAudio) {
                this._currentAudio.pause();
                this._currentAudio = null;
            }
        },

        _speakText(text) {
            if (!this.ttsEnabled || !text) return;
            if (this.ttsProvider === 'browser') {
                this._speakBrowser(text);
            } else {
                this._speakServer(text);
            }
        },

        _speakBrowser(text) {
            if (!window.speechSynthesis) return;

            // Strip markdown for cleaner speech
            var clean = text
                .replace(/```[\s\S]*?```/g, ' ' + i18n.codeBlock + ' ')
                .replace(/`[^`]+`/g, function(m) { return m.slice(1, -1); })
                .replace(/\[([^\]]+)\]\([^)]+\)/g, '$1')
                .replace(/[#*_~>|]/g, '')
                .replace(/\n{2,}/g, '. ')
                .replace(/\n/g, ' ')
                .trim();
            if (!clean) return;

            window.speechSynthesis.cancel();

            var chunks = this._splitForSpeech(clean);
            for (var i = 0; i < chunks.length; i++) {
                var utterance = new SpeechSynthesisUtterance(chunks[i]);
                utterance.lang = 'it-IT';
                utterance.rate = 1.05;

                var voices = window.speechSynthesis.getVoices();
                for (var v = 0; v < voices.length; v++) {
                    if (voices[v].lang && voices[v].lang.startsWith('it')) {
                        utterance.voice = voices[v];
                        break;
                    }
                }
                window.speechSynthesis.speak(utterance);
            }
        },

        _speakServer(text) {
            var self = this;
            self._stopServerAudio();

            fetch('/me/chat/api/tts', {
                method: 'POST',
                headers: self._apiHeaders(),
                body: JSON.stringify({ text: text }),
            })
            .then(function(resp) {
                if (!resp.ok) throw new Error('TTS request failed');
                return resp.blob();
            })
            .then(function(blob) {
                if (!self.ttsEnabled) return;
                var url = URL.createObjectURL(blob);
                var audio = new Audio(url);
                audio.onended = function() {
                    URL.revokeObjectURL(url);
                    self._currentAudio = null;
                };
                audio.onerror = function() {
                    URL.revokeObjectURL(url);
                    self._currentAudio = null;
                };
                self._currentAudio = audio;
                audio.play();
            })
            .catch(function(err) {
                console.error('Server TTS error:', err);
            });
        },

        _splitForSpeech(text) {
            // Split at sentence boundaries, max ~200 chars per chunk
            var maxLen = 200;
            if (text.length <= maxLen) return [text];

            var chunks = [];
            var remaining = text;
            while (remaining.length > 0) {
                if (remaining.length <= maxLen) {
                    chunks.push(remaining);
                    break;
                }
                // Find last sentence end within maxLen
                var cut = -1;
                var separators = ['. ', '! ', '? ', '; '];
                for (var s = 0; s < separators.length; s++) {
                    var idx = remaining.lastIndexOf(separators[s], maxLen);
                    if (idx > cut) cut = idx + separators[s].length;
                }
                if (cut <= 0) {
                    // No sentence boundary, cut at last space
                    cut = remaining.lastIndexOf(' ', maxLen);
                    if (cut <= 0) cut = maxLen;
                }
                chunks.push(remaining.substring(0, cut).trim());
                remaining = remaining.substring(cut).trim();
            }
            return chunks;
        },

        _bubbleConversation(convId) {
            // Move a conversation to top of its section (pinned or unpinned)
            var self = this;
            var targetId = convId || self.activeConversationId;
            if (!targetId) return;
            var idx = -1;
            for (var i = 0; i < self.conversations.length; i++) {
                if (self.conversations[i].id === targetId) {
                    idx = i;
                    break;
                }
            }
            if (idx < 0) return;
            var conv = self.conversations[idx];
            conv.updated_at = new Date().toISOString().replace('T', ' ').substring(0, 19);
            if (idx > 0) {
                self.conversations.splice(idx, 1);
                // Insert at top of the correct section (pinned stay with pinned)
                if (conv.pinned) {
                    self.conversations.unshift(conv);
                } else {
                    // Insert after last pinned conversation
                    var insertAt = 0;
                    for (var j = 0; j < self.conversations.length; j++) {
                        if (self.conversations[j].pinned) {
                            insertAt = j + 1;
                        } else {
                            break;
                        }
                    }
                    self.conversations.splice(insertAt, 0, conv);
                }
            }
        },

        formatDate(ts) {
            if (!ts) return '';
            // ts is like "2025-01-15 14:30:00"
            try {
                var d = new Date(ts.replace(' ', 'T'));
                var now = new Date();
                var diff = now - d;
                if (diff < 86400000 && d.getDate() === now.getDate()) {
                    return d.toLocaleTimeString('it-IT', {hour: '2-digit', minute: '2-digit'});
                }
                if (diff < 604800000) {
                    return d.toLocaleDateString('it-IT', {weekday: 'short', hour: '2-digit', minute: '2-digit'});
                }
                return d.toLocaleDateString('it-IT', {day: 'numeric', month: 'short'});
            } catch(e) {
                return ts;
            }
        },

        _formatTime(ts) {
            if (!ts) return '';
            try {
                var d = new Date(ts.replace(' ', 'T'));
                var now = new Date();
                var time = d.toLocaleTimeString('it-IT', {hour: '2-digit', minute: '2-digit'});
                if (d.getDate() === now.getDate() && d.getMonth() === now.getMonth() && d.getFullYear() === now.getFullYear()) {
                    return time;
                }
                var date = d.toLocaleDateString('it-IT', {day: 'numeric', month: 'short'});
                return date + ' ' + time;
            } catch(e) {
                return '';
            }
        },

        scrollToBottom(force) {
            var el = document.getElementById('chat-messages');
            if (!el) return;
            var nearBottom = (el.scrollHeight - el.scrollTop - el.clientHeight) < 100;
            if (force || nearBottom) {
                el.scrollTop = el.scrollHeight;
                this.hasNewMessages = false;
            } else {
                // User is reading older messages — show "new message" indicator
                this.hasNewMessages = true;
            }
        },

        jumpToBottom() {
            var el = document.getElementById('chat-messages');
            if (!el) return;
            el.scrollTop = el.scrollHeight;
            this.hasNewMessages = false;
        }
    };
}
</script>
{% endblock %}
