name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Cache pre-commit hooks
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-py3.12-${{ hashFiles('.pre-commit-config.yaml') }}
      - name: Install pre-commit
        run: pip install pre-commit
      - name: Run pre-commit
        run: pre-commit run --all-files --show-diff-on-failure

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install ruff==0.15.1

      - name: Run ruff check
        run: ruff check .

      - name: Run ruff format check
        run: ruff format --check .

  test:
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-${{ matrix.python-version }}-

      - name: Install dependencies
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev,all]"

      - name: Run tests
        run: pytest tests/unit -v --cov=ui --cov=core --cov-report=xml --cov-report=term

      - name: Upload coverage
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: coverage.xml
          fail_ci_if_error: false

  type-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Cache pip
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-mypy-${{ hashFiles('pyproject.toml') }}

      - name: Install dependencies
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev,all]"

      - name: Run mypy
        run: mypy ui/ core/ --ignore-missing-imports

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Cache pip
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-security-${{ hashFiles('pyproject.toml') }}

      - name: Install dependencies
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install ".[dev,all]" pip-audit
          pip install --upgrade "setuptools>=78.1.1"

      - name: Dependency vulnerability scan
        # CVE-2026-3219: pip <=26.0.1 conflates concatenated tar+ZIP files.
        # No fix release as of 2026-04-25; only triggered by malicious package
        # archives during install — we pin our own deps and don't install
        # arbitrary user input, so the path isn't reachable in our runtime.
        #
        # Starlette PYSEC-2026-161/248/249/2280/2281: all fixed in Starlette
        # 1.x, but the codebase is pinned to starlette<0.51.0 because fastapi's
        # TemplateResponse call sites use the pre-1.0 signature (tracked for
        # the 1.x migration in issue #181). Reachability audited — none apply
        # to the running app:
        #   - 161 (Host header -> request.url.path auth bypass): the only
        #     request.url.path security check lives in OAuth2BearerMiddleware,
        #     which is not mounted; no active middleware/route reads request.url
        #     for authorization.
        #   - 248 (path -> request.url.hostname): no request.url.hostname/netloc
        #     usage anywhere in the codebase.
        #   - 249 (form limits ignored for urlencoded): we never set
        #     max_fields/max_part_size, so no configured limit is bypassed;
        #     generic large-body DoS is bounded by the fronting proxy.
        #   - 2280 (HTTPEndpoint method confusion): no Starlette HTTPEndpoint
        #     subclasses — routes are FastAPI APIRouter handlers.
        #   - 2281 (StaticFiles SSRF on Windows): Linux-only deployment.
        run: >-
          pip-audit --desc --skip-editable
          --ignore-vuln CVE-2026-4539 --ignore-vuln CVE-2026-3219
          --ignore-vuln PYSEC-2026-161 --ignore-vuln GHSA-86qp-5c8j-p5mr
          --ignore-vuln PYSEC-2026-248 --ignore-vuln PYSEC-2026-249
          --ignore-vuln PYSEC-2026-2280 --ignore-vuln PYSEC-2026-2281

      - name: Secret scan
        run: |
          pip install detect-secrets
          detect-secrets scan --all-files \
            --exclude-files '\.env\.example$' \
            --exclude-files '\.venv/' \
            --exclude-files 'node_modules/' \
            > .secrets-baseline.json
          python -c "
          import json, sys
          with open('.secrets-baseline.json') as f:
              baseline = json.load(f)
          results = baseline.get('results', {})
          total = sum(len(v) for v in results.values())
          if total:
              print(f'detect-secrets: {total} potential finding(s) in {len(results)} file(s)')
              for path, secrets in results.items():
                  for s in secrets:
                      print(f'  {path}:{s.get(\"line_number\",\"?\")} [{s.get(\"type\",\"?\")}]')
          else:
              print('No secrets detected')
          "

  build-docker:
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Build Docker image
        run: docker build -t gridbear:test .
        env:
          DOCKER_BUILDKIT: "1"

      - name: Verify container structure
        run: docker run --rm gridbear:test python -c "import ui; import core; print('Import OK')"

  smoke-install:
    # Reproduces the README Setup block against a freshly-cloned workspace.
    # Catches a class of bugs that unit tests can't:
    #   - missing env secrets (POSTGRES_PASSWORD, INTERNAL_API_SECRET,
    #     GRIDBEAR_MASTER_KEY) silently breaking first encrypt/decrypt
    #   - compose override referencing a missing service (e.g. gridbear-ui
    #     after the single-container refactor)
    #   - plugin load failures at boot (import typos, bad manifest,
    #     Dockerfile USER vs entrypoint mismatches)
    #   - admin UI routes 500-ing at first paint
    needs: build-docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Reproduce README Setup — config files
        run: |
          cp docker-compose.yml.example docker-compose.yml
          [ -f .env.example ] && cp .env.example .env || touch .env
          {
            echo "POSTGRES_PASSWORD=$(openssl rand -base64 24 | tr -d '/=+\n')"
            echo "INTERNAL_API_SECRET=$(openssl rand -hex 32)"
            echo "EXECUTOR_TOKEN=$(openssl rand -hex 32)"
            echo "GRIDBEAR_MASTER_KEY=$(openssl rand -base64 64 | tr -d '/=+\n')"
            echo "GRIDBEAR_BASE_URL=http://localhost:8088"
            echo "WEBAUTHN_ORIGIN=http://localhost:8088"
            echo "WEBAUTHN_RP_ID=localhost"
          } >> .env

      - name: docker compose up
        run: |
          docker compose up -d --build
          echo "::group::Waiting for UI"
          for i in $(seq 1 60); do
            if curl -sf -o /dev/null http://localhost:8088/auth/login; then
              echo "UI reachable on attempt $i"
              break
            fi
            sleep 2
          done
          echo "::endgroup::"

      - name: Assert admin endpoints respond without 500
        run: |
          set -e
          for path in /auth/login /auth/setup; do
            code=$(curl -s -o /dev/null -w "%{http_code}" "http://localhost:8088${path}")
            echo "$path -> $code"
            test "${code:0:1}" != "5"
          done

      - name: Assert no plugin failed to load
        run: |
          logs=$(docker compose logs gridbear 2>&1)
          if echo "$logs" | grep -E "(Plugin [a-z_]+ initialization failed|Failed to register routes|No encryption key found|cannot import name)" ; then
            echo "::error::Plugin/import/encryption failure in startup logs — see above"
            exit 1
          fi

      - name: Dump logs + teardown
        if: always()
        run: |
          mkdir -p smoke-logs
          docker compose logs > smoke-logs/compose.log 2>&1 || true
          docker compose down -v --remove-orphans || true

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: smoke-install-logs
          path: smoke-logs/
